<!-- コース -->
<section class="course">
  <div class="l-inner">
    <h2 class="c-section-title">
      <span class="c-section-title__en">Course</span>
      <span class="c-section-title__ja">あなたにぴったりのコースをご紹介！</span>
    </h2>
    <ol class="course__steps">
      <li class="course__step">
        <h3 class="course__step-title">Step1：誰と楽しむ？</h3>
        <ul class="course__options">
          <li class="course__option">
            <button class="course__button course__button--orange" data-step="1" data-value="family">ファミリー</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--green" data-step="1" data-value="partner">パートナー</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--blue" data-step="1" data-value="solo">ひとり</button>
          </li>
        </ul>
      </li>
      <li class="course__step">
        <h3 class="course__step-title">Step2：どんな日に楽しむ？</h3>
        <ul class="course__options">
          <li class="course__option">
            <button class="course__button course__button--orange" data-step="2" data-value="casual">ふらっとお出かけ</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--green" data-step="2" data-value="rainy">雨の日</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--blue" data-step="2" data-value="special">大切な日</button>
          </li>
        </ul>
      </li>
      <li class="course__step">
        <h3 class="course__step-title">Step3：なにを楽しむ？</h3>
        <ul class="course__options">
          <li class="course__option">
            <button class="course__button course__button--orange" data-step="3" data-value="animals">どうぶつ</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--green" data-step="3" data-value="gourmet">グルメ</button>
          </li>
          <li class="course__option">
            <button class="course__button course__button--blue" data-step="3" data-value="attraction">アトラクション</button>
          </li>
        </ul>
      </li>
    </ol>
    <!-- 結果表示エリア -->
    <section class="course__result">
      <h3 class="course__result-title">おすすめコースはこちら！</h3>
      <div id="js-result" class="l-inner course__result-area">
        <span class="js-select"></span>
        <h4 class="js-result-title"></h4>
        <p class="js-result-catchcopy"></p>
        <span>おすすめポイント</span>
        <ul>
          <li></li>
        </ul>
        <p class="js-result-desc"></p>
      </div>
    </section>
  </div>
</section>

<script>
  // course
  // ボタン選択
  const courseSelectBtns = document.querySelectorAll('.course__button');

  courseSelectBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const currentStep = btn.dataset.step;
      const wasSelected = btn.classList.contains('selected');

      if (wasSelected) {
        btn.classList.remove('selected');
      } else {
        const sameStepButtons = document.querySelectorAll(`[data-step="${currentStep}"]`);
        sameStepButtons.forEach((sameBtn) => {
          sameBtn.classList.remove('selected');
        });

        btn.classList.add('selected');
      }

      // 結果を更新する関数を呼び出し
      updateResult();
    });
  });

</script>
